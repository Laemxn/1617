<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pantalla TV - SC 3015</title>
  <meta http-equiv="refresh" content="300">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: black;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .slider {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .slides {
      display: flex;
      width: 600%; /* Cambiado a 600% porque ahora son 6 elementos (1 video + 5 imágenes) */
      height: 100%;
      transition: margin-left 1s ease-in-out;
    }

    .slides img, 
    .slides video {
      width: 100vw;
      height: 100vh;
      object-fit: fill;
      background-color: black;
    }
  </style>
</head>
<body>

  <div class="slider">
    <div class="slides" id="sliderContainer">
      <!-- Elemento 1: Video con sonido -->
      <video id="miVideo" src="Video.mp4" preload="auto"></video>
      
      <!-- Elementos 2 al 6: Las 5 imágenes -->
      <img src="Imagen1.jpg?v=2" alt="Imagen 1">
      <img src="Imagen2.jpg?v=2" alt="Imagen 2">
      <img src="Imagen3.jpg?v=2" alt="Imagen 3">
      <img src="Imagen4.jpg?v=2" alt="Imagen 4">
      <img src="Imagen5.jpeg?v=2" alt="Imagen 5">
    </div>
  </div>

  <script>
    const slider = document.getElementById('sliderContainer');
    const video = document.getElementById('miVideo');
    
    let indiceActual = 0;
    const totalElementos = 6; // 1 video + 5 imágenes = 6 elementos en total (60 segundos de ciclo)

    // Función para iniciar la reproducción del video con sonido de forma segura
    function iniciarReproduccion() {
      video.muted = false;
      video.play().catch(error => {
        console.log("El navegador bloqueó el autoplay con sonido. Intentando silenciado inicial...", error);
        video.muted = true;
        video.play();
      });
    }

    // Ejecutar al cargar la página
    iniciarReproduccion();

    // Cambiar de elemento cada 10 segundos
    setInterval(() => {
      indiceActual = (indiceActual + 1) % totalElementos;
      slider.style.marginLeft = `-${indiceActual * 100}vw`;

      // Si volvemos a la diapositiva 0 (el video), reiniciamos su tiempo y reproducimos
      if (indiceActual === 0) {
        video.currentTime = 0;
        iniciarReproduccion();
      } else {
        // Si estamos en las imágenes, pausamos el video para ahorrar recursos
        video.pause();
      }
    }, 10000); // 10 segundos por cada diapositiva
  </script>

</body>
</html>
