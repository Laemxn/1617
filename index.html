<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pantalla TV - SC 1617</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: black;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Contenedor principal que ocupa toda la pantalla */
    .slider {
      width: 100vw;
      height: 100vh;
      position: relative;
      background: black;
      overflow: hidden;
    }

    /* Cada elemento (imagen o video) se superpone en el mismo espacio exacto */
    .slide-item {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease-in-out;
      object-fit: fill;
      background-color: black;
    }

    /* Elemento activo visible */
    .slide-item.active {
      opacity: 1;
      visibility: visible;
      z-index: 2;
    }
  </style>
</head>
<body>

  <div class="slider" id="sliderContainer">
    
    <!-- 1. Video de Entrada -->
    <video class="slide-item" src="Entrada.mp4" preload="auto" muted playsinline></video>
    
    <!-- 2. Imágenes intermedias -->
    <img class="slide-item" src="imagen1.png" alt="Imagen 1">
    <img class="slide-item" src="imagen2.png" alt="Imagen 2">
    <img class="slide-item" src="imagen3.png" alt="Imagen 3">
    <img class="slide-item" src="imagen4.png" alt="Imagen 4">
    <img class="slide-item" src="imagen5.png" alt="Imagen 5">

    <!-- 3. Video Final -->
    <video class="slide-item" src="Final.mp4" preload="auto" muted playsinline></video>
    
  </div>

  <script>
    const elementos = document.querySelectorAll('.slide-item');
    const totalElementos = elementos.length;
    let indiceActual = 0;
    let temporizador;

    function mostrarElemento(indice) {
      clearTimeout(temporizador);

      // Pausar y resetear todos los videos primero
      elementos.forEach((el, i) => {
        if (el.tagName === 'VIDEO') {
          el.pause();
          el.currentTime = 0;
        }
        // Quitar la clase activa de todos
        el.classList.remove('active');
      });

      // Activar solo el elemento actual
      const actual = elementos[indice];
      actual.classList.add('active');

      if (actual.tagName === 'VIDEO') {
        // Forzar la recarga para que el reproductor de la TV lo procese
        actual.load();

        // Reproducir el video con un pequeño margen para que la TV lo procese
        setTimeout(() => {
          let playPromise = actual.play();
          if (playPromise !== undefined) {
            playPromise.then(() => {
              console.log("Reproduciendo video índice:", indice);
            }).catch(error => {
              console.log("Error al reproducir video en la TV, saltando:", error);
              avanzarSiguiente();
            });
          }
        }, 400);

        // Cuando el video termine, avanza al siguiente
        actual.onended = () => {
          actual.onended = null;
          avanzarSiguiente();
        };

        actual.onerror = () => {
          console.log("Error de formato de video en TV o archivo no encontrado, saltando...");
          avanzarSiguiente();
        };

      } else {
        // Si es imagen, dura exactamente 10 segundos
        temporizador = setTimeout(() => {
          avanzarSiguiente();
        }, 10000);
      }
    }

    function avanzarSiguiente() {
      indiceActual++;
      
      // Si llega al final, regresa a la imagen 1 (índice 1) evitando repetir "Entrada.mp4"
      if (indiceActual >= totalElementos) {
        indiceActual = 1; 
      }
