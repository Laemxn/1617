<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pantalla TV - SC 1617</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: black;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Contenedor principal */
    .slider {
      width: 100vw;
      height: 100vh;
      position: relative;
      background: black;
      overflow: hidden;
    }

    /* Ocultar por defecto con display: none para liberar el decodificador en TV */
    .slide-item {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: none;
      object-fit: fill;
      background-color: black;
    }

    /* Elemento activo visible */
    .slide-item.active {
      display: block;
      z-index: 2;
    }
  </style>
</head>
<body>

  <div class="slider" id="sliderContainer">
    
    <!-- Índice 0: Video de Entrada -->
    <video class="slide-item" src="Entrada.mp4" preload="auto" muted playsinline webkit-playsinline></video>
    
    <!-- Índices 1 al 5: Imágenes intermedias -->
    <img class="slide-item" src="imagen1.png" alt="Imagen 1">
    <img class="slide-item" src="imagen2.png" alt="Imagen 2">
    <img class="slide-item" src="imagen3.png" alt="Imagen 3">
    <img class="slide-item" src="imagen4.png" alt="Imagen 4">
    <img class="slide-item" src="imagen5.png" alt="Imagen 5">

    <!-- Índice 6: Video Final -->
    <video class="slide-item" src="Final.mp4" preload="auto" muted playsinline webkit-playsinline></video>
    
  </div>

  <script>
    const elementos = document.querySelectorAll('.slide-item');
    const totalElementos = elementos.length;
    let indiceActual = 0;
    let temporizador = null;
    let timeoutSeguridadVideo = null;

    function mostrarElemento(indice) {
      clearTimeout(temporizador);
      clearTimeout(timeoutSeguridadVideo);

      // Pausar y ocultar todos los elementos
      elementos.forEach((el) => {
        if (el.tagName === 'VIDEO') {
          el.pause();
          el.currentTime = 0;
        }
        el.classList.remove('active');
      });

      // Activar el elemento actual
      const actual = elementos[indice];
      actual.classList.add('active');

      if (actual.tagName === 'VIDEO') {
        try {
          actual.load(); // Forzar carga en el navegador de la TV
          actual.currentTime = 0;
          
          let playPromise = actual.play();
          if (playPromise !== undefined) {
            playPromise.then(() => {
              console.log("Reproduciendo video índice:", indice);
            }).catch(error => {
              console.log("Error de reproducción automática en TV, avanzando...", error);
              avanzarSiguiente();
            });
          }

          // Cuando el video termina correctamente
          actual.onended = () => {
            actual.onended = null;
            clearTimeout(timeoutSeguridadVideo);
            avanzarSiguiente();
          };

          // Temporizador de seguridad por si el evento onended falla en la TV
          let duracionEstimadaMs = 15000; // 15 segundos por defecto
          if (!isNaN(actual.duration) && actual.duration > 0) {
            duracionEstimadaMs = (actual.duration * 1000) + 1000;
          }

          timeoutSeguridadVideo = setTimeout(() => {
            if (actual.tagName === 'VIDEO' && !actual.paused) {
              console.log("Seguridad de video activada, forzando avance.");
              actual.pause();
              avanzarSiguiente();
            }
          }, duracionEstimadaMs);

        } catch (e) {
          console.log("Excepción al reproducir video:", e);
          avanzarSiguiente();
        }

      } else {
        // Si es imagen, dura exactamente 10 segundos
        temporizador = setTimeout(() => {
          avanzarSiguiente();
        }, 10000);
      }
    }

    function avanzarSiguiente() {
      indiceActual++;
      
      // Si llega al final del arreglo (pasa del último elemento), reinicia la secuencia completa desde 0 (Entrada.mp4)
      if (indiceActual >= totalElementos) {
        indiceActual = 0; 
      }
      
      mostrarElemento(indiceActual);
    }

    // --- SISTEMA ANTI-HIBERNACIÓN ---
    function iniciarAntiHibernacion() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          const audioCtx = new AudioContext();
          const oscillator = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();
          gainNode.gain.value = 0.00001; // Volumen imperceptible
          oscillator.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          oscillator.start();
        }
      } catch (e) {
        console.log("Anti-hibernación por audio no soportado", e);
      }

      // Estímulo periódico para mantener activo el navegador de la TV
      setInterval(() => {
        const dummyDiv = document.createElement('div');
        dummyDiv.style.opacity = '0';
        document.body.appendChild(dummyDiv);
        setTimeout(() => dummyDiv.remove(), 100);
      }, 30000);
    }

    // Iniciar la secuencia al cargar la página
    window.addEventListener('DOMContentLoaded', () => {
      iniciarAntiHibernacion();
      setTimeout(() => {
        mostrarElemento(indiceActual);
      }, 1000);
    });

    // Desbloqueo manual por interacción
    window.addEventListener('click', () => {
      const actual = elementos[indiceActual];
      if (actual.tagName === 'VIDEO' && actual.paused) {
        actual.play().catch(e => console.log(e));
      }
    }, { once: true });
  </script>
</body>
</html>
