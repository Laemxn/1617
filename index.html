<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pantalla TV - SC 1617</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: black;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .slider {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .slides {
      display: flex;
      height: 100%;
      transition: margin-left 1s ease-in-out;
    }

    .slides img, 
    .slides video {
      width: 100vw;
      height: 100vh;
      object-fit: fill; 
      background-color: black;
      flex-shrink: 0; 
    }
  </style>
</head>
<body>

  <div class="slider">
    <div class="slides" id="sliderContainer">
      
      <!-- 1. Video de Entrada (Inicia silenciado y con playsinline para evitar bloqueos del navegador) -->
      <video src="Entrada.mp4" preload="auto" muted playsinline></video>
      
      <!-- 2. Imágenes intermedias -->
      <img src="imagen1.png" alt="Imagen 1">
      <img src="imagen2.png" alt="Imagen 2">
      <img src="imagen3.png" alt="Imagen 3">
      <img src="imagen4.png" alt="Imagen 4">
      <img src="imagen5.png" alt="Imagen 5">

      <!-- 3. Video Final -->
      <video src="Final.mp4" preload="auto" playsinline></video>
      
    </div>
  </div>

  <script>
    const slider = document.getElementById('sliderContainer');
    const elementos = slider.children;
    const totalElementos = elementos.length;
    
    slider.style.width = `${totalElementos * 100}vw`;

    let indiceActual = 0;
    let temporizador;

    function reproducirElementoActual() {
      clearTimeout(temporizador);

      // Pausar y reiniciar todos los videos
      Array.from(elementos).forEach(el => {
        if (el.tagName === 'VIDEO') {
          el.pause();
          el.currentTime = 0;
        }
      });

      const elementoActual = elementos[indiceActual];
      slider.style.marginLeft = `-${indiceActual * 100}vw`;

      if (elementoActual.tagName === 'VIDEO') {
        // Intentar reproducir el video
        let playPromise = elementoActual.play();

        if (playPromise !== undefined) {
          playPromise.then(_ => {
            // Reproducción iniciada con éxito
          }).catch(error => {
            console.log("Reproducción automática bloqueada o error:", error);
            // Si falla, intentamos forzarlo silenciado
            elementoActual.muted = true;
            elementoActual.play().catch(e => {
              // Si de plano falla el video, avanzamos automáticamente para evitar pantalla negra
              avanzarSiguiente();
            });
          });
        }

        elementoActual.onended = () => avanzarSiguiente();
        elementoActual.onerror = () => avanzarSiguiente();

      } else {
        // Las imágenes duran 10 segundos
        temporizador = setTimeout(() => avanzarSiguiente(), 10000);
      }
    }

    function avanzarSiguiente() {
      indiceActual++;
      
      // Cuando llega al final de todo, salta de nuevo a la imagen1 (índice 1) 
      // para evitar volver a reproducir "Entrada.mp4"
      if (indiceActual >= totalElementos) {
        indiceActual = 1; 
      }
      
      reproducirElementoActual();
    }

    // Arranca automáticamente al abrir la página
    reproducirElementoActual();
  </script>

</body>
</html>
