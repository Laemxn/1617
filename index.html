<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pantalla TV - SC 3015</title>
  
  <meta http-equiv="refresh" content="300">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: black;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .slider {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .slides {
      display: flex;
      width: 500%;
      height: 100%;
      animation: carrusel 50s infinite;
    }

    .slides img {
      width: 100vw;
      height: 100vh;
      object-fit: fill;
      background-color: black;
    }

    #btnAudio {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 9999;
      background: #ff0000;
      color: white;
      border: 3px solid white;
      padding: 15px 30px;
      font-size: 22px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
    }

    @keyframes carrusel {
      0%   { margin-left: 0; }
      16%  { margin-left: 0; }

      20%  { margin-left: -100vw; }
      36%  { margin-left: -100vw; }

      40%  { margin-left: -200vw; }
      56%  { margin-left: -200vw; }

      60%  { margin-left: -300vw; }
      76%  { margin-left: -300vw; }

      80%  { margin-left: -400vw; }
      96%  { margin-left: -400vw; }

      100% { margin-left: 0; }
    }
  </style>
</head>
<body>

  <button id="btnAudio" onclick="activarSonidoDefinitivo()">🔊 ACTIVAR SONIDO</button>

  <audio id="miAudio" preload="auto">
    <source src="Sonido.mp3" type="audio/mpeg">
  </audio>

  <div class="slider">
    <div class="slides">
      <img src="Imagen1.jpg?v=2" alt="Imagen 1">
      <img src="Imagen2.jpg?v=2" alt="Imagen 2">
      <img src="Imagen3.jpg?v=2" alt="Imagen 3">
      <img src="Imagen4.jpg?v=2" alt="Imagen 4">
      <img src="Imagen5.jpeg?v=2" alt="Imagen 5">
    </div>
  </div>

  <script>
    const audio = document.getElementById('miAudio');
    const btn = document.getElementById('btnAudio');
    let audioHabilitado = false;
    let inicioAnimacion = Date.now();

    function activarSonidoDefinitivo() {
      audio.play().then(() => {
        audio.pause();
        audio.currentTime = 0;
        audioHabilitado = true;
        inicioAnimacion = Date.now(); // Resetea el ciclo exacto al presionar el botón
        btn.style.display = 'none';
      }).catch(err => {
        console.log("Error al activar:", err);
      });
    }

    // Monitorea el ciclo exacto de 50s vinculado al momento en que se habilita
    setInterval(() => {
      if (!audioHabilitado) return;

      let tiempoTranscurridosMs = Date.now() - inicioAnimacion;
      let tiempoActual = (tiempoTranscurridosMs / 1000) % 50; 
      
      // La imagen 5 se muestra en el bloque de 80% a 100% de la animación (del segundo 40 al 50)
      if (tiempoActual >= 40 && tiempoActual < 50) {
        if (audio.paused) {
          audio.currentTime = 0;
          audio.play().catch(() => {});
        }
      } else {
        if (!audio.paused) {
          audio.pause();
          audio.currentTime = 0;
        }
      }
    }, 200); // Revisa cada 200 milisegundos para mayor precisión
  </script>

</body>
</html>
