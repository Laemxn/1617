<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pantalla TV - SC 1617</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: black;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .slider {
      width: 100vw;
      height: 100vh;
      position: relative;
      background: black;
      overflow: hidden;
    }

    .slide-item {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: none;
      object-fit: fill;
      background-color: black;
    }

    .slide-item.active {
      display: block;
      z-index: 2;
    }
  </style>
</head>
<body>

  <div class="slider" id="sliderContainer">
    
    <!-- Quitamos el muted estricto de aquí para permitir audio -->
    <video class="slide-item" src="Entrada.mp4" preload="auto" playsinline webkit-playsinline></video>
    
    <img class="slide-item" src="imagen1.png" alt="Imagen 1">
    <img class="slide-item" src="imagen2.png" alt="Imagen 2">
    <img class="slide-item" src="imagen3.png" alt="Imagen 3">
    <img class="slide-item" src="imagen4.png" alt="Imagen 4">
    <img class="slide-item" src="imagen5.png" alt="Imagen 5">

    <video class="slide-item" src="Final.mp4" preload="auto" playsinline webkit-playsinline></video>
    
  </div>

  <script>
    const elementos = document.querySelectorAll('.slide-item');
    const totalElementos = elementos.length;
    let indiceActual = 0;
    let temporizador = null;
    let timeoutSeguridadVideo = null;

    function mostrarElemento(indice) {
      clearTimeout(temporizador);
      clearTimeout(timeoutSeguridadVideo);

      elementos.forEach((el) => {
        if (el.tagName === 'VIDEO') {
          el.pause();
          el.currentTime = 0;
        }
        el.classList.remove('active');
      });

      const actual = elementos[indice];
      actual.classList.add('active');

      if (actual.tagName === 'VIDEO') {
        try {
          actual.load();
          actual.currentTime = 0;
          
          // Truco para Smart TV: Forzar el sonido activado mediante JS en tiempo de ejecución
          actual.muted = false; 
          actual.volume = 1.0; // Volumen al máximo

          let playPromise = actual.play();
          if (playPromise !== undefined) {
            playPromise.then(() => {
              console.log("Reproduciendo video con audio, índice:", indice);
            }).catch(error => {
              console.log("Bloqueo de audio detectado por la TV, intentando reproducir en silencio...", error);
              // Plan de respaldo: Si la TV bloquea el audio por políticas de autoplay, lo silencia para que al menos el video corra
              actual.muted = true;
              actual.play();
            });
          }

          actual.onended = () => {
            actual.onended = null;
            clearTimeout(timeoutSeguridadVideo);
            avanzarSiguiente();
          };

          let duracionEstimadaMs = 15000;
          if (!isNaN(actual.duration) && actual.duration > 0) {
            duracionEstimadaMs = (actual.duration * 1000) + 1000;
          }

          timeoutSeguridadVideo = setTimeout(() => {
            if (actual.tagName === 'VIDEO' && !actual.paused) {
              actual.pause();
              avanzarSiguiente();
            }
          }, duracionEstimadaMs);

        } catch (e) {
          console.log("Excepción al reproducir video con audio:", e);
          avanzarSiguiente();
        }

      } else {
        temporizador = setTimeout(() => {
          avanzarSiguiente();
        }, 10000);
      }
    }

    function avanzarSiguiente() {
      indiceActual++;
      if (indiceActual >= totalElementos) {
        indiceActual = 0; 
      }
      mostrarElemento(indiceActual);
    }

    // --- SISTEMA ANTI-HIBERNACIÓN ---
    function iniciarAntiHibernacion() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          const audioCtx = new AudioContext();
          const oscillator = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();
          gainNode.gain.value = 0.00001;
          oscillator.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          oscillator.start();
        }
      } catch (e) {
        console.log(e);
      }

      setInterval(() => {
        const dummyDiv = document.createElement('div');
        dummyDiv.style.opacity = '0';
        document.body.appendChild(dummyDiv);
        setTimeout(() => dummyDiv.remove(), 100);
      }, 30000);
    }

    window.addEventListener('DOMContentLoaded', () => {
      iniciarAntiHibernacion();
      setTimeout(() => {
        mostrarElemento(indiceActual);
      }, 1000);
    });

    // Desbloqueo total de audio por si la TV requiere un "clic" inicial con el control remoto
    window.addEventListener('click', () => {
      const actual = elementos[indiceActual];
      if (actual.tagName === 'VIDEO') {
        actual.muted = false;
        if (actual.paused) {
          actual.play().catch(e => console.log(e));
        }
      }
    }, { once: true });
  </script>
</body>
</html>
