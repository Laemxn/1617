<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pantalla TV - SC 1617</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: black;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .slider {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .slides {
      display: flex;
      height: 100%;
      transition: margin-left 1s ease-in-out;
    }

    .slides img, 
    .slides video {
      width: 100vw;
      height: 100vh;
      object-fit: fill; 
      background-color: black;
      flex-shrink: 0; 
    }
  </style>
</head>
<body>

  <div class="slider">
    <div class="slides" id="sliderContainer">
      
      <!-- 1. Video de Entrada -->
      <video src="Entrada.mp4" preload="auto" muted playsinline></video>
      
      <!-- 2. Imágenes intermedias -->
      <img src="imagen1.png" alt="Imagen 1">
      <img src="imagen2.png" alt="Imagen 2">
      <img src="imagen3.png" alt="Imagen 3">
      <img src="imagen4.png" alt="Imagen 4">
      <img src="imagen5.png" alt="Imagen 5">

      <!-- 3. Video Final -->
      <video src="Final.mp4" preload="auto" muted playsinline></video>
      
    </div>
  </div>

  <script>
    const slider = document.getElementById('sliderContainer');
    const elementos = slider.children;
    const totalElementos = elementos.length;
    
    slider.style.width = `${totalElementos * 100}vw`;

    let indiceActual = 0;
    let temporizador;

    function reproducirElementoActual() {
      clearTimeout(temporizador);

      // Pausar y reiniciar todos los videos
      Array.from(elementos).forEach(el => {
        if (el.tagName === 'VIDEO') {
          el.pause();
          el.currentTime = 0;
        }
      });

      const elementoActual = elementos[indiceActual];
      slider.style.marginLeft = `-${indiceActual * 100}vw`;

      if (elementoActual.tagName === 'VIDEO') {
        // Damos un pequeño respiro a la TV para que procese el cambio de slide antes de reproducir
        setTimeout(() => {
          let playPromise = elementoActual.play();
          if (playPromise !== undefined) {
            playPromise.catch(error => {
              console.log("Error de reproducción en TV:", error);
              avanzarSiguiente();
            });
          }
        }, 300);

        elementoActual.onended = () => avanzarSiguiente();
        elementoActual.onerror = () => {
          console.log("Error de formato en la TV, saltando...");
          avanzarSiguiente();
        };

      } else {
        // Las imágenes duran 10 segundos
        temporizador = setTimeout(() => avanzarSiguiente(), 10000);
      }
    }

    function avanzarSiguiente() {
      indiceActual++;
      
      if (indiceActual >= totalElementos) {
        indiceActual = 1; // Salta a la imagen 1 al terminar el ciclo
      }
      
      reproducirElementoActual();
    }

    window.addEventListener('DOMContentLoaded', () => {
      reproducirElementoActual();
    });
  </script>

</body>
</html>
