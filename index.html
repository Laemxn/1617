<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pantalla TV - SC 3015</title>
  
  <meta http-equiv="refresh" content="300">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: black;
      width: 100vw;
      height: 100vh;
    }

    .slider {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .slides {
      display: flex;
      width: 500%;
      height: 100%;
      animation: carrusel 50s infinite;
    }

    .slides img {
      width: 100vw;
      height: 100vh;
      object-fit: fill;
      background-color: black;
    }

    @keyframes carrusel {
      0%   { margin-left: 0; }
      16%  { margin-left: 0; }

      20%  { margin-left: -100vw; }
      36%  { margin-left: -100vw; }

      40%  { margin-left: -200vw; }
      56%  { margin-left: -200vw; }

      60%  { margin-left: -300vw; }
      76%  { margin-left: -300vw; }

      80%  { margin-left: -400vw; }
      96%  { margin-left: -400vw; }

      100% { margin-left: 0; }
    }
  </style>
</head>
<body>

  <!-- Elemento de Audio corregido con 'S' mayúscula -->
  <audio id="miAudio">
    <source src="Sonido.mp3" type="audio/mpeg">
  </audio>

  <div class="slider">
    <div class="slides">
      <img src="Imagen1.jpg?v=2" alt="Imagen 1">
      <img src="Imagen2.jpg?v=2" alt="Imagen 2">
      <img src="Imagen3.jpg?v=2" alt="Imagen 3">
      <img src="Imagen4.jpg?v=2" alt="Imagen 4">
      <img src="Imagen5.jpeg?v=2" alt="Imagen 5">
    </div>
  </div>

  <script>
    const audio = document.getElementById('miAudio');

    function desbloquearAudio() {
      audio.play().then(() => {
        audio.pause();
        audio.currentTime = 0;
      }).catch(() => {});
      document.removeEventListener('click', desbloquearAudio);
      document.removeEventListener('keydown', desbloquearAudio);
    }

    document.addEventListener('click', desbloquearAudio);
    document.addEventListener('keydown', desbloquearAudio);

    setInterval(() => {
      let tiempoActual = (Date.now() / 1000) % 50;
      
      if (tiempoActual >= 40 && tiempoActual < 50) {
        if (audio.paused) {
          audio.currentTime = 0;
          audio.play().catch(() => {});
        }
      } else {
        if (!audio.paused) {
          audio.pause();
          audio.currentTime = 0;
        }
      }
    }, 500);
  </script>

</body>
</html>
