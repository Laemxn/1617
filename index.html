<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pantalla TV - SC 3015</title>
  <meta http-equiv="refresh" content="300">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: black;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .slider {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .slides {
      display: flex;
      width: 600%;
      height: 100%;
      transition: margin-left 1s ease-in-out;
    }

    .slides img, 
    .slides video {
      width: 100vw;
      height: 100vh;
      object-fit: fill;
      background-color: black;
    }
  </style>
</head>
<body>

  <div class="slider">
    <div class="slides" id="sliderContainer">
      <!-- Elemento 1: Video con el nombre exacto de tu repositorio -->
      <video id="miVideo" src="Entrada.MP4" preload="auto"></video>
      
      <!-- Elementos 2 al 6: Las 5 imágenes -->
      <img src="Imagen1.jpg?v=2" alt="Imagen 1">
      <img src="Imagen2.jpg?v=2" alt="Imagen 2">
      <img src="Imagen3.jpg?v=2" alt="Imagen 3">
      <img src="Imagen4.jpg?v=2" alt="Imagen 4">
      <img src="Imagen5.jpeg?v=2" alt="Imagen 5">
    </div>
  </div>

  <script>
    const slider = document.getElementById('sliderContainer');
    const video = document.getElementById('miVideo');
    
    let indiceActual = 0;
    const totalElementos = 6;

    function iniciarReproduccion() {
      video.muted = false;
      video.play().catch(error => {
        console.log("El navegador bloqueó el autoplay con sonido. Intentando silenciado inicial...", error);
        video.muted = true;
        video.play();
      });
    }

    iniciarReproduccion();

    setInterval(() => {
      indiceActual = (indiceActual + 1) % totalElementos;
      slider.style.marginLeft = `-${indiceActual * 100}vw`;

      if (indiceActual === 0) {
        video.currentTime = 0;
        iniciarReproduccion();
      } else {
        video.pause();
      }
    }, 10000);
  </script>

</body>
</html>
