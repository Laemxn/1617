<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pantalla TV - SC 3015</title>
  <meta http-equiv="refresh" content="300">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: black;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .slider {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .slides {
      display: flex;
      width: 500%;
      height: 100%;
      transition: margin-left 1s ease-in-out; /* Transición suave entre imágenes */
    }

    .slides img {
      width: 100vw;
      height: 100vh;
      object-fit: fill;
      background-color: black;
    }

    #btnAudio {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 9999;
      background: #ff0000;
      color: white;
      border: 3px solid white;
      padding: 15px 30px;
      font-size: 22px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <button id="btnAudio" onclick="activarSonidoDefinitivo()">🔊 ACTIVAR SONIDO</button>

  <audio id="miAudio" preload="auto">
    <source src="Sonido.mp3" type="audio/mpeg">
  </audio>

  <div class="slider">
    <div class="slides" id="sliderContainer">
      <img src="Imagen1.jpg?v=2" alt="Imagen 1">
      <img src="Imagen2.jpg?v=2" alt="Imagen 2">
      <img src="Imagen3.jpg?v=2" alt="Imagen 3">
      <img src="Imagen4.jpg?v=2" alt="Imagen 4">
      <img src="Imagen5.jpeg?v=2" alt="Imagen 5">
    </div>
  </div>

  <script>
    const audio = document.getElementById('miAudio');
    const btn = document.getElementById('btnAudio');
    const slider = document.getElementById('sliderContainer');
    
    let indiceActual = 0;
    let audioHabilitado = false;
    const totalImagenes = 5;

    function activarSonidoDefinitivo() {
      audio.play().then(() => {
        audio.pause();
        audio.currentTime = 0;
        audioHabilitado = true;
        btn.style.display = 'none';
      }).catch(err => {
        console.log("Error al activar:", err);
      });
    }

    // Cambia de imagen cada 10 segundos (5 imágenes = 50 segundos totales)
    setInterval(() => {
      indiceActual = (indiceActual + 1) % totalImagenes;
      slider.style.marginLeft = `-${indiceActual * 100}vw`;

      // Si la imagen actual es la número 5 (índice 4)
      if (audioHabilitado) {
        if (indiceActual === 4) {
          audio.currentTime = 0;
          audio.play().catch(() => {});
        } else {
          audio.pause();
          audio.currentTime = 0;
        }
      }
    }, 10000); // 10 segundos por cada imagen
  </script>

</body>
</html>
